version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: kisanai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisanai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
      - JWT_SECRET=b6862abfd87b9976ab597fef5921f98713d11c2dc298e6d585a6cc3a0a83f606
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kisanai-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  redis_data:
